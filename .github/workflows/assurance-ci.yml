name: assurance-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: assurance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate architecture contracts
        run: python3 scripts/validate_repository.py

      - name: Verify immutable release artifacts
        run: sha256sum --check checksums/SHA256SUMS

      - name: Compile validation code
        run: python3 -m compileall -q scripts
